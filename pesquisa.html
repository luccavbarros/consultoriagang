<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pesquisa rápida</title>
  <link rel="icon" href="assets/favicon-maleta.png" type="image/png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/app.css?v=25" />
  <link rel="stylesheet" href="app/tema.css?v=138" />
  <style>
    /* Pesquisa pública no padrão da plataforma: perguntas em cartões numerados, opções em lista agrupada e barra de progresso */
    body { background: #111; }
    .survey { width: min(600px, 100%); margin: 0 auto; padding: 0 16px 96px; display: grid; gap: 14px; }
    .sv-topo { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 14px 16px 12px; background: rgba(17, 17, 17, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
    .sv-topo__l { display: flex; justify-content: space-between; align-items: center; font-size: var(--t-leg); color: var(--ganggrey); }
    .sv-barra { height: 4px; border-radius: 2px; background: #262626; overflow: hidden; }
    .sv-barra span { display: block; height: 100%; width: 0; border-radius: 2px; background: #f3f3f3; transition: width .3s ease; }
    .sv-cab { padding: 28px 0 10px; display: grid; gap: 6px; }
    .sv-cab .eyebrow { margin: 0; }
    .sv-cab h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.022em; color: #fff; }
    .sv-cab p { margin: 0; font-size: var(--t-ui); color: var(--ganggrey); max-width: 44ch; white-space: pre-line; }
    .survey__q { margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--lightblack); display: grid; gap: 12px; min-width: 0; }
    .sv-q { display: flex; align-items: flex-start; gap: 10px; margin: 0; padding: 0; font-size: var(--t-txt); font-weight: 500; line-height: 1.4; color: #fff; }
    .sv-q__n { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: #242424; box-shadow: inset 0 0 0 1px var(--line-2); font-size: var(--t-micro); font-weight: 600; color: #cfcfcf; font-variant-numeric: tabular-nums; margin-top: -1px; }
    .survey__q.is-ok .sv-q__n { background: #f3f3f3; color: #111; box-shadow: none; }
    legend.sv-q { float: left; width: 100%; }
    legend.sv-q + * { clear: both; }
    .opts { display: grid; border: 1px solid var(--line); border-radius: 11px; background: #171717; overflow: hidden; }
    .opt { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; cursor: pointer; font-size: var(--t-ui); color: #dcdcdc; transition: background-color .15s; }
    .opt + .opt { border-top: 1px solid var(--line); }
    .opt:hover { background: #1c1c1c; }
    .opt:has(input:checked) { background: #222; color: #fff; }
    .opt input { appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin: 0; border-radius: 50%; border: 1px solid #4a4a4a; background: #111; display: grid; place-items: center; }
    .opt input:checked { border-color: #f3f3f3; }
    .opt input:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f3f3f3; }
    .opt input:focus-visible { outline: 2px solid #f3f3f3; outline-offset: 2px; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .scale label { position: relative; display: grid; place-items: center; min-height: 42px; border: 1px solid var(--line-2); border-radius: 9px; background: #171717; cursor: pointer; font-size: var(--t-ui); font-variant-numeric: tabular-nums; color: #dcdcdc; transition: background-color .15s; }
    .scale label:hover { background: #1f1f1f; }
    .scale label:has(input:checked) { background: #f3f3f3; color: #111; border-color: #f3f3f3; }
    .scale input, .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .scale label:has(input:focus-visible), .chips label:has(input:focus-visible) { outline: 2px solid #f3f3f3; outline-offset: 2px; }
    .scale__ends { display: flex; justify-content: space-between; font-size: var(--t-leg); color: var(--ganggrey); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips label { position: relative; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: #171717; cursor: pointer; font-size: var(--t-ui); color: #dcdcdc; }
    .chips label:has(input:checked) { background: #f3f3f3; color: #111; border-color: #f3f3f3; }
    .asset { display: grid; place-items: center; min-height: 132px; padding: 20px; border-radius: 11px; background: #f3f3f3; color: #111; font-size: 18px; font-weight: 500; text-align: center; }
    .asset img { max-width: 70%; max-height: 110px; object-fit: contain; }
    .section-t { margin: 14px 0 0; display: flex; align-items: center; gap: 10px; font-size: var(--t-leg); color: var(--ganggrey); }
    .section-t::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .survey .field { font-size: var(--t-ui); }
    .sv-lembra { display: grid; gap: 8px; }
    .sv-sit { display: grid; gap: 2px; }
    .sv-sit__rot { font-size: var(--t-leg); font-weight: 400; color: var(--ganggrey); }
    .sv-sit__t { font-weight: 500; }
    .chips label.is-nenhuma { border-style: dashed; color: var(--ganggrey); }
    .chips label.is-nenhuma:has(input:checked) { background: #2b2b2b; color: #fff; border-color: #2b2b2b; border-style: solid; }
    .sv-outra { margin-top: 2px; }
    .sv-lembra .field:not(:first-child) { animation: svEntra .25s ease; }
    @keyframes svEntra { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .survey > .btn { width: 100%; height: 44px; margin-top: 6px; }
    .sv-fim { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; }
    .sv-fim__q { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #f3f3f3; color: #111; font-size: 20px; margin-bottom: 8px; }
    .sv-fim h1 { margin: 0; font-size: 24px; font-weight: 600; color: #fff; }
    .sv-fim p { margin: 0; font-size: var(--t-ui); color: var(--ganggrey); max-width: 36ch; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="survey" id="app">
    <p class="small" style="padding-top:40px">Carregando…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app/config.js"></script>
  <script src="app/auth.js?v=2"></script>
  <script src="app/ui.js?v=29"></script>
  <script>
    /* Pesquisa de marca pública: quem responde são os clientes do cliente, sem login.
       O banco só entrega a pesquisa se ela estiver aberta e só aceita respostas válidas (supabase/portal.sql). */
    (async () => {
      const { sb } = window.GangAuth;
      const { el, say } = window.GangUI;
      const app = document.getElementById('app');
      document.documentElement.classList.add('is-ready');
      const token = new URLSearchParams(location.search).get('t') || '';
      const fim = (titulo, texto, ok) => app.replaceChildren(el('div', 'sv-fim', el('span', { class: 'sv-fim__q', 'aria-hidden': 'true' }, ok ? '✓' : 'i'), el('h1', null, titulo), el('p', null, texto)));
      if (!sb || !/^[0-9a-f-]{36}$/i.test(token)) return fim('Link inválido', 'Confira o endereço que você recebeu.');

      const { data: P, error } = await sb.rpc('pesquisa_publica', { p_token: token });
      if (error || !P) return fim('Pesquisa encerrada', 'Esta pesquisa não está mais recebendo respostas. Obrigado!');
      document.title = 'Pesquisa rápida · ' + P.marca;

      const radio = (name, v, t) => el('label', 'opt', el('input', { type: 'radio', name, value: v }), el('span', null, t));
      let nq = 0;
      const perg = (txt, tag, attrs) => el(tag || 'legend', { class: 'sv-q', ...(attrs || {}) }, el('span', 'sv-q__n', String(++nq)), el('span', null, txt));
      // ativos sem imagem e sem texto não têm o que mostrar: ficam de fora
      const ATV = (P.ativos || []).filter((a) => a.imagem_url || (a.texto && a.texto.trim()));
      const escala = (i, frase) => el('fieldset', 'survey__q',
        perg(frase),
        el('div', 'scale', [1, 2, 3, 4, 5].map((n) => el('label', null, el('input', { type: 'radio', name: 'a' + i, value: n, 'aria-label': n + ' de 5' }), String(n)))),
        el('div', 'scale__ends', el('span', null, 'Discordo'), el('span', null, 'Concordo totalmente')));

      // lembrança espontânea: um nome por campo; quando a pessoa começa a escrever, aparece outro campo embaixo (até 6)
      const lembra = el('div', 'sv-lembra');
      const novoCampo = (primeiro) => {
        const n = lembra.children.length + 1;
        const i = el('input', { class: 'field', id: primeiro ? 'q-lembra' : 'q-lembra-' + n, maxlength: 60, autocomplete: 'off',
          placeholder: primeiro ? 'Primeira marca que vem à cabeça' : 'Outra marca (se lembrar)', 'aria-label': 'Marca lembrada ' + n });
        i.addEventListener('input', () => {
          const ultimo = lembra.lastElementChild;
          if (i === ultimo && i.value.trim() && lembra.children.length < 6) lembra.append(novoCampo(false));
        });
        return i;
      };
      lembra.append(novoCampo(true));
      const lembrados = () => [...lembra.querySelectorAll('input')].map((x) => x.value.trim()).filter(Boolean);
      const outraUlt = el('input', { class: 'field sv-outra', id: 'q-outra-ult', maxlength: 60, autocomplete: 'off', placeholder: 'Qual empresa?', hidden: true, 'aria-label': 'Qual outra empresa' });
      let ultimaQ; // montada no lugar certo do formulário, para a numeração seguir a ordem
      const mkUltima = () => el('fieldset', { class: 'survey__q', hidden: true }, perg('Na última vez, de qual empresa você comprou ou contratou?'),
        el('div', 'opts', (P.opcoes || []).map((o) => radio('ult', o, o)), radio('ult', 'Outra', 'Outra empresa'), radio('ult', 'Não lembro', 'Não lembro')),
        outraUlt);
      const outraPref = el('input', { class: 'field sv-outra', id: 'q-outra', maxlength: 60, autocomplete: 'off', placeholder: 'Qual empresa?', hidden: true, 'aria-label': 'Qual outra empresa' });
      const msg = el('p', { class: 'msg', role: 'status', 'aria-live': 'polite' });
      const form = el('form', { class: 'survey', novalidate: true, style: 'padding:0;width:100%' },
        el('div', 'sv-topo', el('div', 'sv-topo__l', el('span', null, 'Pesquisa rápida · anônima'), el('span', { id: 'sv-cont' }, '')), el('div', { class: 'sv-barra', 'aria-hidden': 'true' }, el('span', { id: 'sv-barra' }))),
        // o título fala da categoria, não da marca: o nome da marca só aparece depois das perguntas de lembrança
        el('div', 'sv-cab', el('h1', null, 'Queremos ouvir você'), el('p', null, 'Uma pesquisa rápida sobre ' + P.categoria + '.\nLeva 2 minutos e é anônima.\nNão existe resposta certa.')),
        // triagem pelo comportamento (um fato do passado, não opinião): quem nunca comprou a categoria não é o mercado
        el('fieldset', 'survey__q', perg('Quando foi a última vez que você comprou ou contratou ' + P.categoria + '?'),
          el('div', 'opts', [['3m', 'Nos últimos 3 meses'], ['12m', 'Nos últimos 12 meses'], ['mais', 'Há mais de um ano'], ['nunca', 'Nunca comprei']].map(([v, t]) => radio('rec', v, t)))),
        el('div', 'survey__q', perg('Quando você pensa em ' + P.categoria + ', que marcas vêm à cabeça?', 'label', { for: 'q-lembra' }),
          lembra),
        // de quem comprou da última vez: o que a pessoa fez, e não o que diz que faria
        (ultimaQ = mkUltima()),
        el('fieldset', 'survey__q', perg('Se fosse contratar hoje, qual escolheria?'),
          el('div', 'opts', (P.opcoes || []).map((o) => radio('pref', o, o)), radio('pref', 'Outra', 'Outra empresa'), radio('pref', 'Ainda não sei', 'Ainda não sei')),
          outraPref),
        // a marca é entendida? a pessoa escolhe a frase que melhor a descreve (a ordem é embaralhada)
        (P.frases || []).length ? el('fieldset', 'survey__q', perg('Qual destas frases descreve melhor a ' + P.marca + '?'),
          el('div', 'opts', [...P.frases].sort(() => Math.random() - 0.5).map((f) => radio('frase', f, f)))) : null,
        // situações de compra: em quais marcas a pessoa pensaria em cada momento (disponibilidade mental)
        (P.situacoes || []).length ? el('p', 'section-t', 'Agora imagine algumas situações. Em cada uma, marque as empresas que viriam à sua cabeça.') : null,
        (P.situacoes || []).map((sit, i) => el('fieldset', 'survey__q', perg(el('span', 'sv-sit', el('span', 'sv-sit__rot', 'Quando você pensa'), el('span', 'sv-sit__t', '“' + sit.texto + '”'))),
          el('div', 'chips', [...(P.opcoes || []), 'Outra empresa', 'Nenhuma'].map((o) => el('label', o === 'Nenhuma' ? 'is-nenhuma' : null, el('input', { type: 'checkbox', name: 'c' + i, value: o }), o))))),
        // ativos distintivos: de que marca é isto? (sem o nome)
        ATV.length ? el('p', 'section-t', 'De que empresa é isto? Responda sem pesquisar.') : null,
        ATV.map((a, i) => el('fieldset', 'survey__q', perg('De que empresa é isto?'),
          a.tipo === 'cor' && /^#[0-9a-f]{6}$/i.test(a.texto || '') ? el('div', { class: 'asset', style: 'background:' + a.texto, 'aria-label': 'Uma cor' })
            : a.imagem_url ? el('div', 'asset', el('img', { src: a.imagem_url, alt: 'Imagem para identificar' }))
              : el('div', 'asset', '“' + (a.texto || '') + '”'),
          el('div', 'opts', [...(P.opcoes || []), 'Não sei'].map((o) => radio('v' + i, o, o))))),
        (P.afirmacoes || []).map((f, i) => escala(i, f)),
        el('div', 'survey__q', perg('Uma palavra para descrever ' + P.marca + ':', 'label', { for: 'q-palavra' }),
          el('input', { class: 'field', id: 'q-palavra', maxlength: 60, autocomplete: 'off' })),
        // no fim, para não lembrar o nome da marca antes das perguntas de lembrança
        el('fieldset', 'survey__q', perg('Você já comprou ou contratou a ' + P.marca + '?'),
          el('div', 'opts', radio('cliente', 'sim', 'Sim'), radio('cliente', 'nao', 'Ainda não'), radio('cliente', 'ns', 'Não lembro'))),
        el('button', { class: 'btn btn--light', type: 'submit' }, 'Enviar respostas'), msg);
      app.replaceChildren(form);
      // progresso: quantas perguntas já têm resposta
      const qs = [...form.querySelectorAll('.survey__q')];
      const progresso = () => {
        let ok = 0;
        qs.filter((q) => !q.hidden).forEach((q) => { const r = [...q.querySelectorAll('input')].some((x) => (x.type === 'radio' || x.type === 'checkbox') ? x.checked : x.value.trim()); q.classList.toggle('is-ok', r); if (r) ok += 1; });
        const vis = qs.filter((q) => !q.hidden).length;
        document.getElementById('sv-barra').style.width = Math.round((ok / vis) * 100) + '%';
        document.getElementById('sv-cont').textContent = ok + ' de ' + vis;
      };
      form.addEventListener('change', (ev) => {
        const t = ev.target;
        if (t.name === 'rec') { ultimaQ.hidden = t.value === 'nunca'; if (ultimaQ.hidden) ultimaQ.querySelectorAll('input').forEach((x) => { x.checked = false; }); }
        if (t.name === 'ult') { outraUlt.hidden = t.value !== 'Outra'; if (!outraUlt.hidden) outraUlt.focus(); }
        if (t.name === 'pref') { outraPref.hidden = t.value !== 'Outra'; if (!outraPref.hidden) outraPref.focus(); }
        if (/^c\d+$/.test(t.name) && t.checked) {
          const grupoC = form.querySelectorAll('input[name=' + t.name + ']');
          grupoC.forEach((x) => { if (t.value === 'Nenhuma' ? x !== t : x.value === 'Nenhuma') x.checked = false; });
        }
      });
      form.addEventListener('input', progresso); form.addEventListener('change', progresso); progresso();

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const prefIn = form.querySelector('input[name=pref]:checked');
        const pref = prefIn && prefIn.value === 'Outra' && outraPref.value.trim() ? { value: 'Outra: ' + outraPref.value.trim() } : prefIn;
        const notas = (P.afirmacoes || []).map((_, i) => { const r = form.querySelector('input[name=a' + i + ']:checked'); return r ? Number(r.value) : null; });
        const rec = form.querySelector('input[name=rec]:checked');
        if (!rec) return say(msg, 'Responda quando foi a última vez que comprou ou contratou.', 'error');
        const ultIn = form.querySelector('input[name=ult]:checked');
        const ult = !ultIn ? null : ultIn.value === 'Outra' ? (outraUlt.value.trim() ? 'Outra: ' + outraUlt.value.trim() : 'Outra') : ultIn.value;
        if (!pref || notas.some((n) => n == null)) return say(msg, 'Responda a escolha e todas as frases de 1 a 5.', 'error');
        const frase = form.querySelector('input[name=frase]:checked');
        if ((P.frases || []).length && !frase) return say(msg, 'Escolha a frase que melhor descreve a empresa.', 'error');
        const ceps = Object.fromEntries((P.situacoes || []).map((sit, i) => [sit.id, [...form.querySelectorAll('input[name=c' + i + ']:checked')].map((x) => x.value)]));
        const ativos = {};
        ATV.forEach((a, i) => { const r = form.querySelector('input[name=v' + i + ']:checked'); ativos[a.id] = r ? r.value : 'Não sei'; });
        const btn = form.querySelector('[type=submit]'); btn.disabled = true; say(msg, 'Enviando…');
        const { error: e2 } = await sb.rpc('pesquisa_responder', {
          p_token: token, p_lembranca: lembrados().join(', '), p_preferencia: pref.value,
          p_notas: notas, p_palavra: document.getElementById('q-palavra').value.trim(), p_ceps: ceps, p_ativos: ativos, p_frase: frase ? frase.value : null,
          p_recencia: rec.value, p_ultima: ult,
          p_ja_cliente: (() => { const c = form.querySelector('input[name=cliente]:checked'); return c ? (c.value === 'sim' ? true : c.value === 'nao' ? false : null) : null; })(),
        });
        if (e2) { btn.disabled = false; return say(msg, 'Não foi possível enviar. Tente de novo.', 'error'); }
        fim('Obrigado!', 'Suas respostas foram enviadas. Elas ajudam a empresa a atender cada vez melhor.', true);
      });
    })();
  </script>
</body>
</html>
