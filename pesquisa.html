<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pesquisa rápida</title>
  <link rel="icon" href="assets/favicon-maleta.png" type="image/png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/app.css?v=24" />
  <style>
    .survey { width: min(560px, 100%); margin: 0 auto; padding: 64px 16px 96px; display: grid; gap: 36px; }
    .survey__q { display: grid; gap: 12px; border: 0; margin: 0; padding: 0; min-width: 0; }
    .survey__q legend, .survey__q > label { padding: 0; margin-bottom: 4px; font-size: 18px; line-height: 1.35; color: #fff; }
    .opts { display: grid; gap: 8px; }
    .opt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 18px; border: 1px solid var(--darkgrey); border-radius: 10px; cursor: pointer; font-size: 16px; }
    .opt:has(input:checked) { border-color: var(--white); color: #fff; }
    .opt input { accent-color: var(--white); width: 18px; height: 18px; margin: 0; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .scale label { display: grid; place-items: center; min-height: 48px; border: 1px solid var(--darkgrey); border-radius: 8px; cursor: pointer; font-size: 16px; }
    .scale label:has(input:checked) { background: var(--white); color: var(--black); border-color: var(--white); }
    .scale input { position: absolute; opacity: 0; pointer-events: none; }
    .scale label:has(input:focus-visible) { outline: 2px solid var(--ganggrey); outline-offset: 2px; }
    .scale__ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ganggrey); }
    .survey .btn { width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips label { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--darkgrey); border-radius: 999px; cursor: pointer; font-size: 15px; }
    .chips label:has(input:checked) { background: var(--white); color: var(--black); border-color: var(--white); }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips label:has(input:focus-visible) { outline: 2px solid var(--ganggrey); outline-offset: 2px; }
    .asset { display: grid; place-items: center; min-height: 140px; padding: 20px; border-radius: 12px; background: var(--white); color: var(--black); font-size: 20px; text-align: center; }
    .asset img { max-width: 70%; max-height: 120px; object-fit: contain; }
    .section-t { font-size: 13px; color: var(--ganggrey); margin-top: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="survey" id="app">
    <p class="small">Carregando…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app/config.js"></script>
  <script src="app/auth.js?v=2"></script>
  <script src="app/ui.js?v=9"></script>
  <script>
    /* Pesquisa de marca pública: quem responde são os clientes do cliente, sem login.
       O banco só entrega a pesquisa se ela estiver aberta e só aceita respostas válidas (supabase/portal.sql). */
    (async () => {
      const { sb } = window.GangAuth;
      const { el, say } = window.GangUI;
      const app = document.getElementById('app');
      document.documentElement.classList.add('is-ready');
      const token = new URLSearchParams(location.search).get('t') || '';
      const fim = (titulo, texto) => app.replaceChildren(el('h1', 'title-xl', titulo), el('p', 'small', texto));
      if (!sb || !/^[0-9a-f-]{36}$/i.test(token)) return fim('Link inválido', 'Confira o endereço que você recebeu.');

      const { data: P, error } = await sb.rpc('pesquisa_publica', { p_token: token });
      if (error || !P) return fim('Pesquisa encerrada', 'Esta pesquisa não está mais recebendo respostas. Obrigado!');
      document.title = 'Pesquisa rápida · ' + P.marca;

      const radio = (name, v, t) => el('label', 'opt', el('input', { type: 'radio', name, value: v }), t);
      const escala = (i, frase) => el('fieldset', 'survey__q',
        el('legend', null, frase),
        el('div', 'scale', [1, 2, 3, 4, 5].map((n) => el('label', null, el('input', { type: 'radio', name: 'a' + i, value: n, 'aria-label': n + ' de 5' }), String(n)))),
        el('div', 'scale__ends', el('span', null, 'Discordo'), el('span', null, 'Concordo totalmente')));

      const msg = el('p', { class: 'msg', role: 'status', 'aria-live': 'polite' });
      const form = el('form', { class: 'survey', novalidate: true, style: 'padding:0' },
        el('div', null, el('h1', 'title-xl', 'Leva 2 minutos'), el('p', 'small', 'Sua opinião ajuda a melhorar o atendimento. As respostas são anônimas.')),
        el('div', 'survey__q', el('label', { for: 'q-lembra' }, 'Quando você pensa em ' + P.categoria + ', que marcas vêm à cabeça?'),
          el('input', { class: 'field', id: 'q-lembra', maxlength: 300, autocomplete: 'off', placeholder: 'Escreva as que lembrar' })),
        el('fieldset', 'survey__q', el('legend', null, 'Se fosse contratar hoje, qual escolheria?'),
          el('div', 'opts', (P.opcoes || []).map((o) => radio('pref', o, o)), radio('pref', 'Outra', 'Outra'))),
        // a marca é entendida? a pessoa escolhe a frase que melhor a descreve (a ordem é embaralhada)
        (P.frases || []).length ? el('fieldset', 'survey__q', el('legend', null, 'Qual destas frases descreve melhor a ' + P.marca + '?'),
          el('div', 'opts', [...P.frases].sort(() => Math.random() - 0.5).map((f) => radio('frase', f, f)))) : null,
        // situações de compra: em quais marcas a pessoa pensaria em cada momento (disponibilidade mental)
        (P.situacoes || []).length ? el('p', 'section-t', 'Em cada situação, marque as empresas que viriam à sua cabeça. Pode marcar várias ou nenhuma.') : null,
        (P.situacoes || []).map((sit, i) => el('fieldset', 'survey__q', el('legend', null, sit.texto),
          el('div', 'chips', (P.opcoes || []).map((o) => el('label', null, el('input', { type: 'checkbox', name: 'c' + i, value: o }), o))))),
        // ativos distintivos: de que marca é isto? (sem o nome)
        (P.ativos || []).length ? el('p', 'section-t', 'De que empresa é isto? Responda sem pesquisar.') : null,
        (P.ativos || []).map((a, i) => el('fieldset', 'survey__q', el('legend', { class: 'sr-only' }, 'De que empresa é este item ' + (i + 1) + '?'),
          a.tipo === 'cor' && /^#[0-9a-f]{6}$/i.test(a.texto || '') ? el('div', { class: 'asset', style: 'background:' + a.texto, 'aria-label': 'Uma cor' })
            : a.imagem_url ? el('div', 'asset', el('img', { src: a.imagem_url, alt: 'Imagem para identificar' }))
              : el('div', 'asset', '“' + (a.texto || '') + '”'),
          el('div', 'opts', [...(P.opcoes || []), 'Não sei'].map((o) => radio('v' + i, o, o))))),
        (P.afirmacoes || []).map((f, i) => escala(i, f)),
        el('div', 'survey__q', el('label', { for: 'q-palavra' }, 'Uma palavra para descrever ' + P.marca + ':'),
          el('input', { class: 'field', id: 'q-palavra', maxlength: 60, autocomplete: 'off' })),
        // no fim, para não lembrar o nome da marca antes das perguntas de lembrança
        el('fieldset', 'survey__q', el('legend', null, 'Você já comprou ou contratou a ' + P.marca + '?'),
          el('div', 'opts', radio('cliente', 'sim', 'Sim'), radio('cliente', 'nao', 'Ainda não'), radio('cliente', 'ns', 'Não lembro'))),
        el('button', { class: 'btn btn--light', type: 'submit' }, 'Enviar respostas'), msg);
      app.replaceChildren(form);

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const pref = form.querySelector('input[name=pref]:checked');
        const notas = (P.afirmacoes || []).map((_, i) => { const r = form.querySelector('input[name=a' + i + ']:checked'); return r ? Number(r.value) : null; });
        if (!pref || notas.some((n) => n == null)) return say(msg, 'Responda a escolha e todas as frases de 1 a 5.', 'error');
        const frase = form.querySelector('input[name=frase]:checked');
        if ((P.frases || []).length && !frase) return say(msg, 'Escolha a frase que melhor descreve a empresa.', 'error');
        const ceps = Object.fromEntries((P.situacoes || []).map((sit, i) => [sit.id, [...form.querySelectorAll('input[name=c' + i + ']:checked')].map((x) => x.value)]));
        const ativos = {};
        (P.ativos || []).forEach((a, i) => { const r = form.querySelector('input[name=v' + i + ']:checked'); ativos[a.id] = r ? r.value : 'Não sei'; });
        const btn = form.querySelector('[type=submit]'); btn.disabled = true; say(msg, 'Enviando…');
        const { error: e2 } = await sb.rpc('pesquisa_responder', {
          p_token: token, p_lembranca: document.getElementById('q-lembra').value.trim(), p_preferencia: pref.value,
          p_notas: notas, p_palavra: document.getElementById('q-palavra').value.trim(), p_ceps: ceps, p_ativos: ativos, p_frase: frase ? frase.value : null,
          p_ja_cliente: (() => { const c = form.querySelector('input[name=cliente]:checked'); return c ? (c.value === 'sim' ? true : c.value === 'nao' ? false : null) : null; })(),
        });
        if (e2) { btn.disabled = false; return say(msg, 'Não foi possível enviar. Tente de novo.', 'error'); }
        fim('Obrigado!', 'Suas respostas foram enviadas.');
      });
    })();
  </script>
</body>
</html>
